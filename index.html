<style>
:root{
  --bg:#f3f8f8;--card:#ffffff;--fg:#1f2937;--muted:#64748b;--line:rgba(100,116,139,.28);
  --ok:#16a34a;--low:#d97706;--high:#dc2626;
  --warnbg:#fff4cc;--warnfg:#5b4a00;--infobg:#e3f0ff;--infofg:#16407a;--errbg:#fde4e4;--errfg:#7a1b1b;
  --shadow:0 8px 28px rgba(15,23,42,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1117;--card:#151c24;--fg:#e8edf2;--muted:#9aa7b4;--line:rgba(148,163,184,.26);
    --warnbg:#3b3410;--warnfg:#f3e6a3;--infobg:#12263f;--infofg:#a9cdf5;--errbg:#3d1717;--errfg:#f3b4b4;--shadow:0 8px 28px rgba(0,0,0,.45)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Tamil","Noto Sans",Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}

/* ---------- animated background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;will-change:transform}
.bg .b1{left:-35vmax;top:-35vmax;background:radial-gradient(circle,rgba(15,118,110,.30),transparent 62%);animation:d1 38s ease-in-out infinite alternate}
.bg .b2{right:-40vmax;top:8vh;background:radial-gradient(circle,rgba(29,78,216,.22),transparent 62%);animation:d2 46s ease-in-out infinite alternate}
.bg .b3{left:-25vmax;bottom:-45vmax;background:radial-gradient(circle,rgba(16,185,129,.24),transparent 62%);animation:d3 52s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(22vmax,14vmax,0) scale(1.12)}}
@keyframes d2{to{transform:translate3d(-20vmax,18vmax,0) scale(.92)}}
@keyframes d3{to{transform:translate3d(26vmax,-12vmax,0) scale(1.1)}}

/* ---------- brand bar, logo, floating health icons ---------- */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem}
.brand img{width:34px;height:34px;border-radius:50%;box-shadow:0 2px 10px rgba(11,99,201,.35)}
.ibtn{border:0;background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;border-radius:999px;padding:8px 15px;font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:0 4px 14px rgba(15,118,110,.35)}
.ibtn[hidden]{display:none}
.floaters{position:absolute;inset:0}
.fi{position:absolute;left:var(--x);top:0;opacity:calc(var(--o) * var(--fo,1));transform:translate3d(0,112vh,0);animation:fly var(--t) linear var(--dl) infinite;will-change:transform;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@keyframes fly{0%{transform:translate3d(0,112vh,0) rotate(0deg)}50%{transform:translate3d(var(--sw),50vh,0) rotate(calc(var(--r) / 2))}100%{transform:translate3d(0,-20vh,0) rotate(var(--r))}}
.fi.c0{color:#0f766e}.fi.c1{color:#1d4ed8}.fi.c2{color:#dc2626}.fi.c3{color:#16a34a}.fi.c4{color:#7c3aed}
@media (prefers-color-scheme:dark){.fi{--fo:1.25}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff}
.sw{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem;font-weight:600;box-shadow:var(--shadow)}
.sw .knob{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"] .knob{background:var(--ok)}
.sw[aria-checked="true"] .knob::after{transform:translateX(14px)}

/* ---------- hero ---------- */
.hero{display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;border-radius:20px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#0f766e,#0e7490 55%,#1d4ed8);box-shadow:var(--shadow);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);animation:shine 7s ease-in-out 1.2s infinite}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.hero h1{margin:0 0 6px;font-size:1.6rem;line-height:1.3;font-weight:800}
.hero p{margin:0;opacity:.94;font-size:.96rem}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hlogo{width:88px;height:88px;border-radius:50%;background:#fff;flex:none;box-shadow:0 8px 26px rgba(0,0,0,.28);animation:pop .9s cubic-bezier(.3,1.5,.5,1) .15s both;position:relative;z-index:1}
.ht{position:relative;z-index:1;min-width:0}
.taname{font-weight:700;font-size:1.05rem;margin:0 0 6px;opacity:.95}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-25deg)}to{opacity:1;transform:none}}
@media (max-width:380px){.hlogo{width:66px;height:66px}.hero h1{font-size:1.35rem}}

/* ---------- notes ---------- */
.note{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:.9rem;animation:rise .6s ease both}
.note.warn{background:var(--warnbg);color:var(--warnfg)}
.note.info{background:var(--infobg);color:var(--infofg)}
.note.err{background:var(--errbg);color:var(--errfg)}
.note.ok{background:rgba(22,163,74,.14);color:var(--ok)}

/* ---------- upload ---------- */
.drop{position:relative;border:2px dashed var(--line);border-radius:20px;background:var(--card);padding:24px 16px;text-align:center;margin:14px 0;box-shadow:var(--shadow);transition:border-color .25s,transform .25s,padding .3s;animation:rise .7s .1s ease both}
.drop.over{border-color:var(--ok);transform:scale(1.015)}
.drop .ico{font-size:2.4rem;display:block;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.drop .btn{display:inline-block;margin-top:10px;background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 6px 18px rgba(15,118,110,.35);position:relative;overflow:hidden}
.drop .btn:active{transform:scale(.97)}
.drop small{display:block;color:var(--muted);margin-top:10px;font-size:.8rem}
.drop.compact{padding:12px}
.drop.compact .ico,.drop.compact small.first{display:none}
.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* ---------- progress ---------- */
.prog{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--shadow);animation:rise .4s ease both}
.prog .lbl{font-weight:600;margin-bottom:10px}
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.pbar b{display:block;height:100%;width:var(--p,8%);border-radius:99px;background:linear-gradient(90deg,#0f766e,#1d4ed8);transition:width .4s ease;position:relative;overflow:hidden}
.pbar b::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.prog small{display:block;margin-top:10px;color:var(--muted);font-size:.8rem}

/* ---------- summary ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.sum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .seg{transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:2rem;line-height:1}
.ring .mid span{font-size:.75rem;color:var(--muted)}
.leg{display:grid;gap:8px;min-width:150px}
.leg div{display:flex;align-items:center;gap:10px;font-size:.95rem}
.leg i{width:12px;height:12px;border-radius:50%}
.leg b{font-size:1.15rem;min-width:1.6em}
.leg .ok i{background:var(--ok)}.leg .low i{background:var(--low)}.leg .high i{background:var(--high)}

/* ---------- filter ---------- */
.chips{display:flex;gap:8px;margin:6px 0 10px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---------- rows ---------- */
.rows{display:grid;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);position:relative;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.row.low{border-left:5px solid var(--low)}.row.high{border-left:5px solid var(--high)}.row.ok{border-left:5px solid var(--ok)}
.intro .row{opacity:0;transform:translateY(18px)}
.intro .row.in{opacity:1;transform:none}
.row[hidden]{display:none}
.r1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nm{font-weight:700;font-size:1rem}
.nm small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.val{text-align:right;white-space:nowrap}
.val b{font-size:1.3rem}
.val small{display:block;color:var(--muted);font-size:.74rem}
.r2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 10px;font-size:.84rem;color:var(--muted)}
.bd{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:800;white-space:nowrap}
.bd.ok{background:rgba(22,163,74,.16);color:var(--ok)}.bd.low{background:rgba(217,119,6,.18);color:var(--low)}.bd.high{background:rgba(220,38,38,.16);color:var(--high)}
.intro .row .bd{transform:scale(.5);opacity:0;transition:transform .5s cubic-bezier(.3,1.6,.5,1) .35s,opacity .3s .35s}
.intro .row.in .bd{transform:none;opacity:1}
.bar{position:relative;height:9px;border-radius:99px;background:var(--line)}
.zone{position:absolute;top:0;bottom:0;border-radius:99px;background:rgba(22,163,74,.62);transition:width 1s ease-out .15s}
.mk{position:absolute;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.35);transition:left 1.2s cubic-bezier(.2,.8,.2,1) .2s}
.mk.ok{background:var(--ok)}.mk.low{background:var(--low)}.mk.high{background:var(--high)}
.mk.pulse{animation:pulse 1.4s ease-out 1.3s 3}
@keyframes pulse{0%{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 0 rgba(220,38,38,.55)}100%{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 14px rgba(220,38,38,0)}}
.mk.low.pulse{animation-name:pulse2}
@keyframes pulse2{0%{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 0 rgba(217,119,6,.55)}100%{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 14px rgba(217,119,6,0)}}

/* ---------- details ---------- */
.row.abn{cursor:pointer}
.more{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.84rem;font-weight:700;color:var(--muted)}
.more .chev{display:inline-block;transition:transform .3s}
.row.open .more .chev{transform:rotate(90deg)}
.exbody{height:0;overflow:hidden;transition:height .4s cubic-bezier(.2,.8,.2,1)}
.exin{padding-top:10px;font-size:.92rem}
.exin p{margin:0 0 9px}
.exin b{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

.cap{font-size:.78rem;color:var(--muted);margin:10px 2px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:.88rem}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;font-size:.78rem;max-height:260px;overflow:auto;margin:10px 0 0}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin:20px 0 6px}

/* ---------- animation off ---------- */
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
.noanim .intro .row,.noanim .intro .row .bd{opacity:1!important;transform:none!important}
.noanim .bg{display:none}
.noanim .hero::after{display:none}
</style>
</head>

ளையணுக்கள் அதிகமாக உள்ளன. இது பெரும்பாலும் வைரஸ் தொற்றைக் குறிக்கும்.", "reasons": "வைரஸ் தொற்று.", "risk": "", "diet": "", "doctor": "அறிகுறிகள் தொடர்ந்தால் மருத்துவரை அணுகவும்."}}, "Fasting Blood Sugar": {"LOW": {"meaning": "இரத்தச் சர்க்கரை அளவு குறைவாக உள்ளது.", "reasons": "நீண்ட நேரம் சாப்பிடாமல் இருப்பது, சில மருந்துகள்.", "risk": "", "diet": "வியர்வை, நடுக்கம், தலைசுற்றல் இருந்தால் இனிப்பான ஏதாவது சாப்பிடவும்.", "doctor": "அடிக்கடி இப்படி இருந்தால் மருத்துவரை அணுகவும்."}, "HIGH": {"meaning": "வெறும் வயிற்றில் இரத்தச் சர்க்கரை அளவு அதிகமாக உள்ளது. இது நீரிழிவுக்கு முந்தைய நிலை அல்லது நீரிழிவாக இருக்கலாம். இந்தப் பரிசோதனை வெறும் வயிற்றில் எடுக்கப்பட்டதா என்பதையும் உறுதிசெய்யவும்.", "reasons": "பரிசோதனைக்கு முன் உணவு உண்டிருத்தல், மன அழுத்தம், சில மருந்துகள்.", "risk": "குடும்பத்தில் நீரிழிவு, உடல் பருமன், உடற்பயிற்சி இல்லாமை, அதிக இனிப்பு உணவுகள்.", "diet": "இனிப்பு, குளிர்பானங்கள், வெள்ளை அரிசி அளவைக் குறைத்து, காய்கறி, கீரை, கேழ்வரகு, கம்பு போன்ற சிறுதானியங்களைச் சேர்க்கவும். தினமும் 30 நிமிடம் நடைப்பயிற்சி செய்யவும்.", "doctor": "நீரிழிவை உறுதிசெய்ய HbA1c போன்ற பரிசோதனைகள் தேவைப்படலாம். மருத்துவரை அணுகவும்."}}, "Total Cholesterol": {"HIGH": {"meaning": "மொத்த கொலஸ்ட்ரால் அதிகமாக உள்ளது. இது நீண்ட காலத்தில் இதய நோய் அபாயத்தை அதிகரிக்கலாம்.", "reasons": "கொழுப்பு அதிகமான உணவு, உடற்பயிற்சி இல்லாமை, மரபு.", "risk": "குடும்பத்தில் இதய நோய், உடல் பருமன், புகைப்பழக்கம், நீரிழிவு, உயர் இரத்த அழுத்தம்.", "diet": "வறுத்த உணவு, நெய், வனஸ்பதி, இறைச்சிக் கொழுப்பைக் குறைக்கவும். ஓட்ஸ், பழங்கள், காய்கறிகள், கொட்டைகள் சேர்க்கவும். தினமும் நடைப்பயிற்சி செய்யவும்.", "doctor": "LDL, HDL, ட்ரைகிளிசரைடு பரிசோதனைகள் தேவையா என்று மருத்துவரிடம் கேளுங்கள்."}}, "TSH": {"LOW": {"meaning": "தைராய்டு தூண்டும் ஹார்மோன் (TSH) குறைவாக உள்ளது. தைராய்டு அதிகமாகச் செயல்படுவதை (ஹைப்பர்தைராய்டிசம்) குறிக்கலாம்.", "reasons": "தைராய்டு சுரப்பி அதிகமாகச் செயல்படுதல், சில மருந்துகள்.", "risk": "பெண்கள், குடும்பத்தில் தைராய்டு பிரச்சினை.", "diet": "", "doctor": "T3, T4 பரிசோதனைகள் தேவையா என்று மருத் வாக உள்ளன.", "reasons": "சில மருந்துகள், ஸ்டீராய்டு பயன்பாடு, சில சமயம் சாதாரண மாறுபாடு.", "risk": "", "diet": "", "doctor": "மற்ற இரத்த மதிப்புகளுடன் சேர்த்து மருத்துவர் மதிப்பிடுவார். மருத்துவரிடம் கேளுங்கள்."}, "HIGH": {"meaning": "மோனோசைட் வெள்ளையணுக்கள் அதிகமாக உள்ளன.", "reasons": "நீண்டகாலத் தொற்று, வீக்கம், தொற்றிலிருந்து குணமடையும் காலம்.", "risk": "", "diet": "", "doctor": "காய்ச்சல், எடை குறைதல் போன்ற அறிகுறிகள் இருந்தால் மருத்துவரை அணுகவும்."}}, "Eosinophils": {"LOW": {"meaning": "ஈசினோஃபில் வெள்ளையணுக்கள் குறைவாக உள்ளன.", "reasons": "ஸ்டீராய்டு மருந்துகள், மன அழுத்தம். பெரும்பாலும் முக்கியமில்லாத மாறுபாடு.", "risk": "", "diet": "", "doctor": "மற்ற இரத்த மதிப்புகளுடன் சேர்த்து மருத்துவர் மதிப்பிடுவார். மருத்துவரிடம் கேளுங்கள்."}, "HIGH": {"meaning": "ஈசினோஃபில் வெள்ளையணுக்கள் அதிகமாக உள்ளன.", "reasons": "ஒவ்வாமை, ஆஸ்துமா, தோல் ஒவ்வாமை, குடல் புழுக்கள்.", "risk": "ஒவ்வாமை வரலாறு, தூசி, சில உணவுகள் அல்லது மருந்துகளால் ஒவ்வாமை.", "diet": "உங்களுக்கு ஒவ்வாத பொருட்களைத் தவிர்க்கவும்.", "doctor": "இருமல், மூச்சிரைப்பு, தோல் அரிப்பு இருந்தால் மருத்துவரை அணுகவும்."}}, "Basophils": {"LOW": {"meaning": "பேசோஃபில் வெள்ளையணுக்கள் குறைவாக உள்ளன. இது பொதுவாக முக்கியமில்லாத மாறுபாடு.", "reasons": "", "risk": "", "diet": "", "doctor": "மற்ற இரத்த மதிப்புகளுடன் சேர்த்து மருத்துவர் மதிப்பிடுவார். மருத்துவரிடம் கேளுங்கள்."}, "HIGH": {"meaning": "பேசோஃபில் வெள்ளையணுக்கள் அதிகமாக உள்ளன.", "reasons": "ஒவ்வாமை, வீக்கம், அரிதாக இரத்த தொடர்பான நோய்கள்.", "risk": "", "diet": "", "doctor": "மருத்துவரிடம் காட்டி காரணத்தை அறியவும்."}}, "HbA1c": {"LOW": {"meaning": "கடந்த 2-3 மாத சராசரி சர்க்கரை அளவு குறைவாகக் காணப்படுகிறது.", "reasons": "இரத்தசோகை, சமீபத்திய இரத்த இழப்பு இருந்தால் இப்படிக் காட்டலாம்.", "risk": "", "diet": "", "doctor": "மருத்துவரிடம் கேளுங்கள்."}, "HIGH": {"meaning": "கடந்த 2-3 மாதங்களின் சராசரி இரத்தச் சர்க்கரை அளவு அதிகமாக உள்ளது. இது நீரிழிவுக்கு முந்தைய நிலை அல்லது நீரிழிவாக இருக்கலாம்.", "reasons": "சர்க்கரை கட்டுப்பாடு சரியில்லாமை, இனிப்பு, மாவுச்சத்து அதிகம்.", "risk": "குடும்பத்தில் நீரிழிவு, உடல் பருமன், உடற்பயிற்சி இல்லாமை, அதிக இனிப்பு உணவுகள்.", "diet": "இனிப்பு, குளிர்பானங்கள், வெள்ளை அரிசி அளவைக் குறைத்து, காய்கறி, கீரை, கேழ்வரகு, கம்பு போன்ற சிறுதானியங்களைச் சேர்க்கவும். தினமும் 30 நிமிடம் நடைப்பயிற்சி செய்யவும்.", "doctor": "மருத்துவரை அணுகி நீரிழிவு உறுதியா என்றும் சிகிச்சை தேவையா என்றும் கேளுங்கள்."}}, "Triglycerides": {"HIGH": {"meaning": "டிரைகிளிசரைடு (இரத்தக் கொழுப்பு) அதிகமாக உள்ளது. இது இதய நோய் அபாயத்தை அதிகரிக்கலாம்.", "reasons": "இனிப்பு, மாவுச்சத்து, வறுத்த உணவு அதிகம், மது, உடற்பயிற்சி இல்லாமை, நீரிழிவு.", "risk": "குடும்பத்தில் இதய நோய், உடல் பருமன், புகைப்பழக்கம், நீரிழிவு, உயர் இரத்த அழுத்தம்.", "diet": "இனிப்பு, குளிர்பானங்கள், பேக்கரி உணவுகள், வெள்ளை அரிசி, மது குறைக்கவும். மீன், கொட்டைகள், காய்கறிகள் சேர்த்து தினமும் நடைப்பயிற்சி செய்யவும்.", "doctor": "மதிப்பு மிக அதிகமாக இருந்தாலோ வயிற்று வலி இருந்தாலோ விரைவில் மருத்துவரை அணுகவும்."}}, "HDL Cholesterol": {"LOW": {"meaning": "HDL ('நல்ல' கொலஸ்ட்ரால்) குறைவாக உள்ளது. இது இதய நோய் அபாயத்தை அதிகரிக்கலாம்.", "reasons": "உடற்பயிற்சி இல்லாமை, புகைப்பழக்கம், உடல் பருமன், நீரிழிவு.", "risk": "குடும்பத்தில் இதய நோய், உடல் பருமன், புகைப்பழக்கம், நீரிழிவு, உயர் இரத்த அழுத்தம்.", "diet": "தினமும் நடைப்பயிற்சி அல்லது உடற்பயிற்சி செய்யவும், புகைப்பழக்கத்தை நிறுத்தவும். கொட்டைகள், மீன், பழங்கள், காய்கறிகள் சேர்க்கவும்.", "doctor": "மற்ற கொலஸ்ட்ரால் மதிப்புகளுடன் சேர்த்து மருத்துவரிடம் கேளுங்கள்."}}, "LDL Cholesterol": {"HIGH": {"meaning": "LDL ('கெட்ட' கொலஸ்ட்ரால்) அதிகமாக உள்ளது. இது நீண்ட காலத்தில் இதய நோய் அபாயத்தை அதிகரிக்கலாம்.", "reasons": "கொழுப்பு அதிகமான உணவு, உடற்பயிற்சி இல்லாமை, மரபு.", "risk": "குடும்பத்தில் இதய நோய், உடல் பருமன், புகைப்பழக்கம், நீரிழிவு, உயர் இரத்த அழுத்தம்.", "diet": "வறுத்த உணவு, நெய், வனஸ்பதி, இறைச்சிக் கொழுப்பைக் குறைக்கவும். ஓட்ஸ், பழங்கள், காய்கறிகள், கொட்டைகள் சேர்க்கவும். தினமும் நடைப்பயிற்சி செய்யவும்.", "doctor": "உங்கள் இதய அபாயத்தைப் பொறுத்து சிகிச்சை தேவையா என்று மருத்துவரிடம் கேளுங்கள்."}}, "Creatinine": {"LOW": {"meaning": "கிரியாட்டினின் குறைவாக உள்ளது. இது பெரும்பாலும் தசை குறைவு அல்லது அதிக நீர் குடிப்பதால் இருக்கலாம்.", "reasons": "குறைந்த தசை, கர்ப்பம்.", "risk": "", "diet": "", "doctor": "மருத்துவரிடம் கேளுங்கள்."}, "HIGH": {"meaning": "கிரியாட்டினின் அதிகமாக உள்ளது. சிறுநீரகம் இரத்தத்தை முழுமையாக வடிகட்டவில்லை என்பதற்கான அறிகுறியாக இருக்கலாம்.", "reasons": "நீர்ச்சத்து குறைவு, சிறுநீரக பாதிப்பு, அதிக இறைச்சி உணவு அல்லது கடுமையான உடற்பயிற்சி, சில மருந்துகள்.", "risk": "நீரிழிவு, உயர் இரத்த அழுத்தம், குடும்பத்தில் சிறுநீரக நோய், வலி மாத்திரைகளை அடிக்கடி எடுத்தல்.", "diet": "போதுமான தண்ணீர் குடிக்கவும். மருத்துவர் சொல்லாமல் வலி மாத்திரைகளை எடுக்க வேண்டாம்.", "doctor": "விரைவில் மருத்துவரை அணுகவும். கால் வீக்கம், சிறுநீர் குறைவு இருந்தால் உடனே காட்டவும்."}}, "Vitamin D": {"LOW": {"meaning": "வைட்டமின் D குறைவாக உள்ளது. எலும்பு வலி, சோர்வு, தசை வலிக்குக் காரணமாகலாம்.", "reasons": "சூரிய ஒளி குறைவு, உணவில் குறைவு, வயது, அதிக உடல் எடை.", "risk": "வீட்டுக்குள் அதிக நேரம், மூடிய ஆடை, கருமையான தோல், வெயிலில் செல்லாமை.", "diet": "காலை அல்லது மாலை இளம் வெயிலில் தினமும் 15-20 நிமிடம் இருக்கலாம். முட்டை மஞ்சள் கரு, மீன், பால், காளான் உதவும். சப்ளிமெண்ட் அளவை மருத்துவர்தான் தீர்மானிக்க வேண்டும்.", "doctor": "எலும்பு வலி தொடர்ந்தால் மருத்துவரை அணுகி சரியான அளவில் சப்ளிமெண்ட் பெறவும்."}, "HIGH": {"meaning": "வைட்டமின் D அதிகமாக உள்ளது. பொதுவாக அதிக சப்ளிமெண்ட் எடுப்பதால் இப்படி வரலாம்.", "reasons": "அதிக அளவு வைட்டமின் D மாத்திரைகள்.", "risk": "", "diet": "", "doctor": "சப்ளிமெண்ட் எடுத்துக்கொண்டிருந்தால் அளவை மருத்துவரிடம் உறுதிசெய்யுங்கள்."}}, "SGPT (ALT)": {"HIGH": {"meaning": "கல்லீரல் நொதி (SGPT/ALT) அதிகமாக உள்ளது. கல்லீரலில் வீக்கம் அல்லது பாதிப்பு இருக்கலாம்.", "reasons": "கொழுப்பு கல்லீரல், மது, ஹெபடைடிஸ் தொற்று, சில மருந்துகள்.", "risk": "உடல் பருமன், நீரிழிவு, அதிக மது, கொழுப்பு அதிகமான உணவு.", "diet": "மது முழுமையாகத் தவிர்க்கவும். வறுத்த, எண்ணெய் அதிகமான உணவுகளைக் குறைக்கவும். காய்கறி, பழங்கள் சேர்த்து, தினமும் நடைப்பயிற்சி செய்யவும். மருத்துவர் சொல்லாமல் மூலிகை, மாத்திரைகளை எடுக்க வேண்டாம்.", "doctor": "கண், தோல் மஞ்சளாதல், வயிற்று வலி, தொடர் வாந்தி இருந்தால் உடனே மருத்துவரை அணுகவும். மற்றபடி மருத்துவரிடம் காட்டி மேலும் பரிசோதனைகள் செய்யவும்."}}, "SGOT (AST)": {"HIGH": {"meaning": "நொதி (SGOT/AST) அதிகமாக உள்ளது. கல்லீரல் அல்லது தசை பாதிப்பைக் குறிக்கலாம்.", "reasons": "கொழுப்பு கல்லீரல், மது, ஹெபடைடிஸ் தொற்று, கடுமையான உடற்பயிற்சி, சில மருந்துகள்.", "risk": "உடல் பருமன், நீரிழிவு, அதிக மது.", "diet": "மது முழுமையாகத் தவிர்க்கவும். வறுத்த, எண்ணெய் அதிகமான உணவுகளைக் குறைக்கவும். காய்கறி, பழங்கள் சேர்த்து, தினமும் நடைப்பயிற்சி செய்யவும். மருத்துவர் சொல்லாமல் மூலிகை, மாத்திரைகளை எடுக்க வேண்டாம்.", "doctor": "கண், தோல் மஞ்சளாதல், வயிற்று வலி, தொடர் வாந்தி இருந்தால் உடனே மருத்துவரை அணுகவும். மற்றபடி மருத்துவரிடம் காட்டி மேலும் பரிசோதனைகள் செய்யவும்."}}}, "en": {"Hemoglobin": {"LOW": {"meaning": "Your hemoglobin is lower than normal. This can be a sign of anemia.", "reasons": "Common causes are iron, vitamin B12 or folate deficiency and heavy menstrual bleeding.", "risk": "Poor diet, blood loss, pregnancy, intestinal worms.", "diet": "Include green leafy vegetables, beetroot, dates, chickpeas, lentils, eggs and jaggery. Having lemon or amla with meals helps your body absorb iron.", "doctor": "See a doctor soon if you feel tired, breathless or dizzy, or if the value is very low."}, "HIGH": {"meaning": "Your hemoglobin is higher than normal.", "reasons": "Dehydration, smoking, or living at high altitude can cause this.", "risk": "", "diet": "Drink enough water.", "doctor": "Please see a doctor to find the cause."}}, "RBC Count": {"LOW": {"meaning": "Your red blood cell count is low. This may be linked to anemia.", "reasons": "Iron or vitamin B12 deficiency, or blood loss.", "risk": "", "diet": "Include green leafy vegetables, beetroot, dates, chickpeas, lentils, eggs and jaggery. Having lemon or amla with meals helps your body absorb iron.", "doctor": "See a doctor soon if you feel tired, breathless or dizzy, or if the value is very low."}, "HIGH": {"meaning": "Your red blood cell count is high.", "reasons": "Dehydration, smoking, or living at high altitude can cause this.", "risk": "", "diet": "Drink enough water.", "doctor": "Please see a doctor to find the cause."}}, "Hematocrit (PCV)": {"LOW": {"meaning": "The share of red cells in your blood is low. It usually goes along with anemia.", "reasons": "Iron deficiency or blood loss.", "risk": "", "diet": "Include green leafy vegetables, beetroot, dates, chickpeas, lentils, eggs and jaggery. Having lemon or amla with meals helps your body absorb iron.", "doctor": "See a doctor soon if you feel tired, breathless or dizzy, or if the value is very low."}, "HIGH": {"meaning": "The share of red cells in your blood is high. Dehydration can cause this.", "reasons": "Dehydration, smoking, or living at high altitude can cause this.", "risk": "", "diet": "Drink enough water.", "doctor": "See a doctor if it stays high."}}, "MCV": {"LOW": {"meaning": "Your red blood cells are smaller than normal.", "reasons": "Iron deficiency, or inherited conditions such as thalassemia.", "risk": "", "diet": "Include green leafy vegetables, beetroot, dates, chickpeas, lentils, eggs and jaggery. Having lemon or amla with meals helps your body absorb iron.", "doctor": "Ask your doctor whether an iron test (ferritin) is needed."}, "HIGH": {"meaning": "Your red blood cells are larger than normal.", "reasons": "Vitamin B12 or folate deficiency, heavy alcohol use, thyroid problems.", "risk": "", "diet": "Eggs, milk, curd, lentils and green leafy vegetables can help.", "doctor": "Ask your doctor whether a B12 test is needed."}}, "MCH": {"LOW": {"meaning": "Each red cell carries less hemoglobin than normal.", "reasons": "Iron deficiency.", "risk": "", "diet": "Include green leafy vegetables, beetroot, dates, chickpeas, lentils, eggs and jaggery. Having lemon or amla with meals helps your body absorb iron.", "doctor": "Discuss with your doctor along with your hemoglobin and MCV."}, "HIGH": {"meaning": "Each red cell carries more hemoglobin than normal.", "reasons": "Vitamin B12 or folate deficiency.", "risk": "", "diet": "Eggs, milk, curd, lentils and green leafy vegetables can help.", "doctor": "Ask your doctor whether a B12 test is needed."}}, "MCHC": {"LOW": {"meaning": "The hemoglobin concentration in your red cells is low (paler red cells).", "reasons": "Iron deficiency.", "risk": "", "diet": "Include green leafy vegetables, beetroot, dates, chickpeas, lentils, eggs and jaggery. Having lemon or amla with meals helps your body absorb iron.", "doctor": "Discuss with your doctor along with your hemoglobin and MCV."}, "HIGH": {"meaning": "The hemoglobin concentration in your red cells is slightly high.", "reasons": "Variation in how the blood sample was collected or tested, or rarely certain red cell conditions.", "risk": "", "diet": "", "doctor": "If your other blood values are normal, this is often not significant. Ask your doctor to confirm."}}, "WBC Count": {"LOW": {"meaning": "Your white blood cell count is low. This may mean reduced immunity.", "reasons": "Viral infection, some medicines, poor nutrition.", "risk": "", "diet": "Eat a balanced, nutritious diet and get enough rest.", "doctor": "See a doctor if you get frequent infections or fever."}, "HIGH": {"meaning": "Your white blood cell count is high. There may be an infection or inflammation.", "reasons": "Bacterial infection, inflammation, stress, smoking.", "risk": "", "diet": "", "doctor": "See a doctor if you have fever or pain."}}, "Platelet Count": {"LOW": {"meaning": "Your platelet count is low. This can affect blood clotting.", "reasons": "Viral fevers such as dengue, some medicines, vitamin deficiency.", "risk": "", "diet": "Drink plenty of fluids.", "doctor": "See a doctor immediately if you also have fever, bleeding from the nose or gums, or skin rashes."}, "HIGH": {"meaning": "Your platelet count is high.", "reasons": "Infection, inflammation, iron deficiency.", "risk": "", "diet": "", "doctor": "Please see a doctor to find the cause."}}, "Neutrophils": {"LOW": {"meaning": "Your neutrophil count is low.", "reasons": "Viral infection, some medicines.", "risk": "", "diet": "", "doctor": "See a doctor if you have fever."}, "HIGH": {"meaning": "Your neutrophil count is high. This most often points to a bacterial infection.", "reasons": "Bacterial infection, stress, smoking.", "risk": "", "diet": "", "doctor": "See a doctor if you have fever or pain."}}, "Lymphocytes": {"LOW": {"meaning": "Your lymphocyte count is low.", "reasons": "Infection, stress, some medicines.", "risk": "", "diet": "", "doctor": "Please ask your doctor."}, "HIGH": {"meaning": "Your lymphocyte count is high. This most often points to a viral infection.", "reasons": "Viral infection.", "risk": "", "diet": "", "doctor": "See a doctor if symptoms continue."}}, "Monocytes": {"LOW": {"meaning": "Your monocyte count is low.", "reasons": "Some medicines, steroid use, sometimes normal variation.", "risk": "", "diet": "", "doctor": "A doctor will interpret this together with your other blood values. Please ask your doctor."}, "HIGH": {"meaning": "Your monocyte count is high.", "reasons": "Long-standing infection, inflammation, recovery after an infection.", "risk": "", "diet": "", "doctor": "See a doctor if you have symptoms such as fever or weight loss."}}, "Eosinophils": {"LOW": {"meaning": "Your eosinophil count is low.", "reasons": "Steroid medicines, stress. Usually not significant.", "risk": "", "diet": "", "doctor": "A doctor will interpret this together with your other blood values. Please ask your doctor."}, "HIGH": {"meaning": "Your eosinophil count is high.", "reasons": "Allergies, asthma, skin allergies, intestinal worms.", "risk": "History of allergy, dust, certain foods or medicines.", "diet": "Avoid things you are allergic to.", "doctor": "See a doctor if you have cough, wheezing or skin itching."}}, "Basophils": {"LOW": {"meaning": "Your basophil count is low. This is usually not significant.", "reasons": "", "risk": "", "diet": "", "doctor": "A doctor will interpret this together with your other blood values. Please ask your doctor."}, "HIGH": {"meaning": "Your basophil count is high.", "reasons": "Allergy, inflammation, rarely blood disorders.", "risk": "", "diet": "", "doctor": "Please see a doctor to find the cause."}}, "Fasting Blood Sugar": {"LOW": {"meaning": "Your blood sugar is low.", "reasons": "Going a long time without food, some medicines.", "risk": "", "diet": "If you feel sweaty, shaky or dizzy, have something sweet right away.", "doctor": "See a doctor if this happens often."}, "HIGH": {"meaning": "Your fasting blood sugar is high. This may point to pre-diabetes or diabetes. Also check that the test was done on an empty stomach.", "reasons": "Eating before the test, stress, some medicines.", "risk": "Family history of diabetes, obesity, lack of exercise, a lot of sweet food.", "diet": "Cut down on sweets, soft drinks and white rice. Include vegetables, greens and millets such as ragi and kambu. Walk 30 minutes daily.", "doctor": "Further tests such as HbA1c may be needed to confirm. Please see a doctor."}}, "HbA1c": {"LOW": {"meaning": "Your average blood sugar over the last 2-3 months appears low.", "reasons": "Anemia or recent blood loss can make the result look lower.", "risk": "", "diet": "", "doctor": "Please ask your doctor."}, "HIGH": {"meaning": "Your average blood sugar over the last 2-3 months is high. This may point to pre-diabetes or diabetes.", "reasons": "Poorly controlled sugar, a lot of sweets and starch.", "risk": "Family history of diabetes, obesity, lack of exercise, a lot of sweet food.", "diet": "Cut down on sweets, soft drinks and white rice. Include vegetables, greens and millets such as ragi and kambu. Walk 30 minutes daily.", "doctor": "Please see a doctor to confirm and discuss whether treatment is needed."}}, "Total Cholesterol": {"HIGH": {"meaning": "Your total cholesterol is high. Over time this can raise the risk of heart disease.", "reasons": "Fatty diet, lack of exercise, family tendency.", "risk": "Family history of heart disease, obesity, smoking, diabetes, high blood pressure.", "diet": "Cut down on fried food, ghee, vanaspati and fatty meat. Add oats, fruits, vegetables and nuts. Walk daily.", "doctor": "Ask your doctor whether LDL, HDL and triglyceride tests are needed."}}, "Triglycerides": {"HIGH": {"meaning": "Your triglycerides (blood fat) are high. This can raise the risk of heart disease.", "reasons": "A lot of sweets, starch and fried food, alcohol, lack of exercise, diabetes.", "risk": "Family history of heart disease, obesity, smoking, diabetes, high blood pressure.", "diet": "Cut down on sweets, soft drinks, bakery items, white rice and alcohol. Eat fish, nuts and vegetables and walk daily.", "doctor": "See a doctor soon if the value is very high or you have stomach pain."}}, "HDL Cholesterol": {"LOW": {"meaning": "Your HDL ('good') cholesterol is low. This can raise the risk of heart disease.", "reasons": "Lack of exercise, smoking, obesity, diabetes.", "risk": "Family history of heart disease, obesity, smoking, diabetes, high blood pressure.", "diet": "Exercise or walk daily and quit smoking. Include nuts, fish, fruits and vegetables.", "doctor": "Discuss with your doctor along with your other cholesterol values."}}, "LDL Cholesterol": {"HIGH": {"meaning": "Your LDL ('bad') cholesterol is high. Over time this can raise the risk of heart disease.", "reasons": "Fatty diet, lack of exercise, family tendency.", "risk": "Family history of heart disease, obesity, smoking, diabetes, high blood pressure.", "diet": "Cut down on fried food, ghee, vanaspati and fatty meat. Add oats, fruits, vegetables and nuts. Walk daily.", "doctor": "Ask your doctor whether treatment is needed based on your overall heart risk."}}, "Creatinine": {"LOW": {"meaning": "Your creatinine is low. This is often due to low muscle mass or drinking a lot of   }
  const rows = el('div', 'rows'); const rowEls = R.rows.map(r => rowEl(r, intro));
  rowEls.forEach(r => { r.hidden = S.filter === 'abn' && r.dataset.status === 'NORMAL'; rows.appendChild(r); });
  out.appendChild(rows);
  if (intro && S.anim && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); e.target._reveal(); } }), { threshold: 0.15 });
    rowEls.forEach((r, i) => { r.style.transitionDelay = (i % 4) * 70 + 'ms'; io.observe(r); });
    setTimeout(() => rowEls.forEach(r => { if (!r.classList.contains('in')) r._reveal(); }), 6000);
  } else rowEls.forEach(r => r._reveal());

  out.appendChild(el('div', 'cap', l.legend));
  out.appendChild(el('div', 'cap', l.caption));
  out.appendChild(abnN ? note('info', l.tips) : note('ok', l.all_ok));
  const det = el('details'); det.append(el('summary', null, l.text_exp), el('pre', null, R.text)); out.appendChild(det);
  out.appendChild(el('div', 'cap', l.not_stored));
}

/* ---- file handling ---- */
let busy = false;
async function showResult(text, source) {
  const a = analyzeText(text);
  S.result = { ...a, source, text, discharge: looksLikeDischarge(text) };
  S.filter = 'all'; applyText(); render(true);
}
async function handleFile(file) {
  if (!file || busy) return;
  busy = true; $('#out').hidden = true;
  try {
    const { text, source } = await readFile(file, (k, v, f) => showProgress(k, v, f));
    showProgress('p_analyze', null, 1);
    await new Promise(r => setTimeout(r, 150));
    await showResult(text, source);
    $('#out').scrollIntoView({ behavior: S.anim ? 'smooth' : 'auto', block: 'start' });
  } catch (e) {
    const out = $('#out'); out.replaceChildren(); out.hidden = false;
    out.appendChild(note('err', e && e.message === 'NET' ? L().net_error : L().read_error));
    if (!(e && e.message === 'NET')) out.appendChild(el('div', 'cap', fill(L().tech_err, { e: e && e.message ? e.message : String(e) })));
  } finally { hideProgress(); busy = false; $('#file').value = ''; }
}

/* ---- wiring ---- */
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('#animSw').addEventListener('click', () => setAnim(!S.anim));
$('#file').addEventListener('change', e => handleFile(e.target.files[0]));
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

/* ---- floating health icons ---- */
function makeFloaters() {
  const host = $('#floaters'); host.replaceChildren();
  const NS = 'http://www.w3.org/2000/svg';
  const icons = ['drop', 'heart', 'cross', 'pill', 'steth', 'syringe', 'thermo', 'ecg', 'tube', 'dna', 'bandage', 'report', 'lens', 'spark'];
  const n = innerWidth < 520 ? 14 : 22;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'fi c' + (i % 5));
    const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#i-' + icons[i % icons.length]); s.appendChild(u);
    const size = 34 + rnd() * 48;
    s.style.width = s.style.height = size.toFixed(0) + 'px';
    s.style.setProperty('--x', ((i + rnd() * 0.8) / n * 96).toFixed(1) + 'vw');
    s.style.setProperty('--o', (0.17 + rnd() * 0.12).toFixed(2));
    s.style.setProperty('--t', (30 + rnd() * 28).toFixed(0) + 's');
    s.style.setProperty('--dl', '-' + (rnd() * 55).toFixed(0) + 's');
    s.style.setProperty('--sw', ((rnd() - 0.5) * 14).toFixed(1) + 'vw');
    s.style.setProperty('--r', ((rnd() < 0.5 ? -1 : 1) * (40 + rnd() * 120)).toFixed(0) + 'deg');
    host.appendChild(s);
  }
}
makeFloaters();

/* ---- install as an app (PWA) ---- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; deferredInstall = null; });
$('#installBtn').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {}
  deferredInstall = null; $('#installBtn').hidden = true;
});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

S.lang = store.get('lr_lang') === 'en' ? 'en' : 'ta';
const savedAnim = store.get('lr_anim');
setAnim(savedAnim === null ? !reduceMotion : savedAnim === '1');
applyText();

window.__lr = { analyzeText, itemsToLines, looksLikeDischarge, showResult, setLang, setAnim, state: S };
})();
